x-tunnel: &tunnel
  build:
    context: .
    dockerfile: Dockerfile.tunnel
    args:
      HANASAND_RELEASE_COMMIT: ${HANASAND_RELEASE_COMMIT:-unknown}
  image: hanasand-recovery-tunnel:latest
  restart: unless-stopped
  network_mode: host
  volumes:
    - /home/hanasand/hanasand/ops/secrets/private/reverse-tunnel-key:/run/key:ro
    - /home/hanasand/hanasand/ops/secrets/private/ovh-known-hosts:/run/known_hosts:ro
  healthcheck: &tunnel-healthcheck
    test: ["CMD", "pgrep", "-x", "ssh"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  labels: &release-label
    com.hanasand.release: ${HANASAND_RELEASE_COMMIT:-unknown}

services:
  tunnel:
    <<: *tunnel
    container_name: hanasand-tunnel
    command:
      - -R
      - 127.0.0.1:18443:127.0.0.1:443
      - -R
      - 127.0.0.1:18097:127.0.0.1:18097
      - -R
      - 127.0.0.1:18502:127.0.0.1:18502
      - -R
      - 127.0.0.1:19911:127.0.0.1:19901
      - -L
      - 127.0.0.1:19300:127.0.0.1:19300
      - -L
      - 127.0.0.1:19080:127.0.0.1:19080
      - -L
      - 127.0.0.1:19090:127.0.0.1:19090
      - -L
      - 127.0.0.1:19097:127.0.0.1:19097
      - -L
      - 127.0.0.1:18506:127.0.0.1:18506
      - -L
      - 127.0.0.1:19911:127.0.0.1:19901
      - ubuntu@192.99.32.185

  tunnel-database:
    <<: *tunnel
    container_name: hanasand-tunnel-database
    command:
      - -R
      - 127.0.0.1:28503:127.0.0.1:8503
      - -R
      - 127.0.0.1:28502:127.0.0.1:18502
      - -L
      - 127.0.0.1:28506:127.0.0.1:18506
      - ubuntu@192.99.32.185

  tunnel-intelligence:
    <<: *tunnel
    container_name: hanasand-tunnel-intelligence
    command:
      - -R
      - 127.0.0.1:28097:127.0.0.1:18097
      - -L
      - 127.0.0.1:29097:127.0.0.1:19097
      - ubuntu@192.99.32.185

  tunnel-web:
    <<: *tunnel
    container_name: hanasand-tunnel-web
    command:
      - -L
      - 127.0.0.1:29300:127.0.0.1:19300
      - -L
      - 127.0.0.1:29080:127.0.0.1:19080
      - -L
      - 127.0.0.1:29090:127.0.0.1:19090
      - ubuntu@192.99.32.185

  tunnel-monitor:
    <<: *tunnel
    container_name: hanasand-tunnel-monitor
    command:
      - -R
      - 127.0.0.1:29911:127.0.0.1:19901
      - -L
      - 127.0.0.1:29911:127.0.0.1:19901
      - ubuntu@192.99.32.185

  tunnel-replication:
    <<: *tunnel
    container_name: hanasand-tunnel-replication
    command:
      - -C
      - -R
      - 127.0.0.1:18503:127.0.0.1:8503
      - ubuntu@192.99.32.185

  tunnel-support:
    <<: *tunnel
    container_name: hanasand-tunnel-support
    command:
      - -L
      - 127.0.0.1:29181:127.0.0.1:19181
      - ubuntu@192.99.32.185

  tunnel-ai:
    <<: *tunnel
    container_name: hanasand-tunnel-ai
    command:
      - -R
      - 127.0.0.1:28080:127.0.0.1:8080
      - ubuntu@192.99.32.185

  proxy-1:
    image: haproxy@sha256:de601ccc9a79b715055bc5c8d51ff357edca04c1e869f4209f02bf6872fde8ac
    container_name: hanasand-proxy-1
    user: haproxy
    command: ["haproxy", "-W", "-db", "-f", "/recovery/haproxy.cfg"]
    restart: unless-stopped
    labels: *release-label
    network_mode: host
    volumes:
      - /home/hanasand/runtime/proxy:/recovery:ro
    healthcheck: &proxy-healthcheck
      test: ["CMD", "pidof", "haproxy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy-2:
    image: haproxy@sha256:de601ccc9a79b715055bc5c8d51ff357edca04c1e869f4209f02bf6872fde8ac
    container_name: hanasand-proxy-2
    user: haproxy
    command: ["haproxy", "-W", "-db", "-f", "/recovery/haproxy-secondary.cfg"]
    restart: unless-stopped
    labels: *release-label
    network_mode: host
    volumes:
      - /home/hanasand/runtime/proxy:/recovery:ro
    healthcheck:
      <<: *proxy-healthcheck

  log-catchup-pg-check:
    image: postgres:16-alpine
    container_name: log-catchup-pg-check
    restart: "no"
    environment:
      POSTGRES_USER: log_test
      POSTGRES_DB: log_test
    volumes:
      - log-catchup-pg-data:/var/lib/postgresql/data
    networks:
      - log-catchup-test
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "log_test", "-d", "log_test"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  log-catchup-test:
    external: true
    name: log-catchup-test

volumes:
  log-catchup-pg-data:
    external: true
    name: 04ad6686915be9861ce621f4684233000d788a635cd193a3c5dc2523a76ee6ec
