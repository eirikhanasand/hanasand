[databases]
* = host=hanasand_database port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 18505
unix_socket_dir = /run/pgbouncer
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
auth_user = hanasand
auth_dbname = hanasand
auth_query = SELECT username, password FROM pgbouncer.get_auth($1)
admin_users = hanasand
stats_users = hanasand
pool_mode = transaction
max_client_conn = 4096
max_db_connections = 40
max_db_client_connections = 4096
default_pool_size = 40
reserve_pool_size = 0
max_prepared_statements = 200
track_extra_parameters = statement_timeout
server_lifetime = 45
server_idle_timeout = 15
server_connect_timeout = 3
query_wait_timeout = 30
log_connections = 0
log_disconnections = 0
